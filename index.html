<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>TIỆM TRÀ NHỎ — Pha trà sữa &amp; quản lý quán</title>
<meta name="theme-color" content="#f6eee0">
<meta name="description" content="Game pha trà sữa cozy: rót trà tới vạch, thêm đường đá topping theo đơn, phục vụ nhiều khách, nhập kho và mở rộng quán.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiệm Trà Nhỏ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#f6eee0; --cream2:#ece0ca; --ink:#4f3d30; --dim:#a08a73; --pink:#b85a6e; --pink2:#cf8291; --pinkbg:#f4e6e8; --green:#6fae63; --line:#e9ddc7; --card:#fffaf0; --gold:#e0a53a; --red:#d1564e; --teal:#3faa9a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; background:#e8dcc7; color:var(--ink); font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; user-select:none;}
  .display{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;}
  #wrap{position:fixed; inset:0; display:flex; flex-direction:column; max-width:520px; margin:0 auto; background:var(--cream); box-shadow:0 0 60px rgba(150,110,80,.2);}
  #awn{height:7px; flex:none; background:repeating-linear-gradient(90deg,var(--pink2) 0 18px,#f1dce0 18px 36px); opacity:.7;}
  #top{flex:none; display:flex; align-items:center; gap:8px; padding:9px 14px 7px;}
  .stat{display:flex; flex-direction:column; line-height:1.05;}
  .stat .k{font-size:9px; color:var(--dim); font-weight:700; text-transform:uppercase; letter-spacing:1px;}
  .stat .v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  #shopName{font-weight:800; font-size:15px;}
  .tleft{display:flex; flex-direction:column; line-height:1.14; min-width:0; flex:1;}
  .tleft small{font-size:10px; color:var(--dim); font-weight:700;}
  .tmid{text-align:center; line-height:1.06;}
  #clock{font-family:"Baloo 2",sans-serif; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .tmid small{font-size:12px; font-weight:800; color:#c07a2c;}
  #money .v{color:#c07a2c;}
  #rep{display:flex; flex-direction:column; align-items:flex-end; line-height:1.05;}
  #repStars{color:var(--gold); font-size:13px; letter-spacing:1px;}
  #repNum{font-size:10px; color:var(--dim); font-weight:700;}
  #chips{flex:none; display:flex; gap:6px; padding:0 14px 8px; font-size:11px; font-weight:800; color:var(--ink); align-items:center;}
  .chip{background:var(--cream2); border-radius:999px; padding:3px 9px; display:inline-flex; gap:4px; align-items:center;}
  .chip.low{background:#f6dcd9; color:var(--red);} .chip.staff{background:#e3efdb; color:#4e8f44;}
  #queueLeft{flex:1; text-align:right; color:var(--dim); font-weight:700;}

  /* customer slots */
  #slots{flex:none; display:flex; gap:7px; padding:0 12px 6px;}
  .slot{flex:1; min-width:0; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:8px 8px 9px; display:flex; flex-direction:column; gap:5px; box-shadow:0 2px 8px rgba(150,110,80,.07);}
  .slot.empty{border-style:dashed; align-items:center; justify-content:center; color:#c6b599; font-weight:700; font-size:12px; box-shadow:none; background:transparent;}
  .slot.active{border-color:var(--pink); box-shadow:0 2px 12px rgba(184,90,110,.18);}
  .slot .sh{display:flex; align-items:center; gap:6px;}
  .slot .sav{width:26px; height:26px; flex:none; border-radius:50%; background:var(--pink2); display:flex; align-items:center; justify-content:center; font-size:15px;}
  .slot .sn{font-weight:800; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
  .slot .stg{font-size:9px; font-weight:800; padding:1px 5px; border-radius:999px;}
  .slot .stg.picky{background:#f6dcd9; color:var(--red);} .slot .stg.rich{background:#fbeecb; color:#a8781a;}
  .slot .so{font-size:10.5px; font-weight:600; line-height:1.32; color:var(--ink); min-height:40px;}
  .slot .so b{color:var(--pink);}
  .slot .sbar{height:6px; border-radius:999px; background:#eadcc4; overflow:hidden;}
  .slot .sbar i{display:block; height:100%; border-radius:999px; width:100%; background:linear-gradient(90deg,#7fd17a,#56b85a);}
  .slot .sbt{display:flex; gap:5px;}
  .slot .sbt button{flex:1; border:none; border-radius:9px; padding:7px 4px; font-weight:800; font-size:11px; cursor:pointer;}
  .slot .give{background:var(--pink); color:#fff;} .slot .give:active{transform:scale(.96);}
  .slot .rej{background:var(--cream2); color:var(--dim);} .slot .rej:active{transform:scale(.96);}

  /* mixing cup */
  #stage{flex:1; display:flex; align-items:center; justify-content:center; gap:14px; padding:2px 12px; min-height:0;}
  .cupBox{display:flex; flex-direction:column; align-items:center; gap:3px;}
  .cup{position:relative; width:78px; height:110px; background:#fffdf8; border:3px solid #e8dcc4; clip-path:polygon(14% 0,86% 0,77% 100%,23% 100%); overflow:hidden; transition:height .15s, width .15s;}
  .cup.L{width:88px; height:128px;}
  .cup .liquid{position:absolute; left:0; right:0; bottom:0; height:0; background:#e9dcc4; transition:background .15s;}
  .cup .mark{position:absolute; left:-2px; right:-2px; border-top:2px dashed var(--teal); opacity:0; z-index:3;}
  .cup .mark.on{opacity:.9;}
  .cup .pearls{position:absolute; left:8%; right:8%; bottom:3px; display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-items:flex-end;}
  .cup .pearls i{width:10px; height:10px; border-radius:50%; display:block; box-shadow:0 1px 1px rgba(0,0,0,.28), inset 0 -2px 2px rgba(0,0,0,.18);}
  .cup .pearls i.jel{width:9px; height:9px; border-radius:3px; opacity:.92;}
  .cup .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#c9b89a; text-align:center; font-weight:700; padding:0 8px;}
  .straw{width:7px; height:34px; border-radius:4px; background:var(--pink2); margin:-10px auto 0; position:relative; z-index:2; transform:rotate(10deg);}
  .mixLbl{font-size:11px; color:var(--dim); font-weight:800;}
  .pourHint{font-size:10px; color:var(--teal); font-weight:800;}

  /* builder */
  #build{flex:none; background:var(--card); border-top:1.5px solid var(--line); border-radius:18px 18px 0 0; padding:9px 12px 12px; overflow-y:auto; max-height:46vh; box-shadow:0 -4px 16px rgba(150,110,80,.06);}
  .step{font-size:10.5px; font-weight:800; color:var(--dim); letter-spacing:.3px; margin:8px 2px 4px; text-transform:uppercase;}
  .step:first-child{margin-top:1px;}
  .opts{display:grid; gap:6px;}
  .opts.sz{grid-template-columns:repeat(2,1fr);} .opts.tea{grid-template-columns:repeat(3,1fr);} .opts.top{grid-template-columns:repeat(3,1fr);}
  .opt{border:1.5px solid var(--line); background:#fffdf8; border-radius:12px; padding:7px 3px; cursor:pointer; font-weight:700; font-size:12px; color:var(--ink); text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; transition:.1s; line-height:1.1;}
  .opt:active{transform:scale(.95);}
  .opt.sel{border-color:var(--pink); background:var(--pinkbg); box-shadow:0 0 0 2px rgba(184,90,110,.2);}
  .opt .px{font-size:9px; color:var(--dim); font-weight:700;}
  .opt .ic2{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));}
  #pourBtn{width:100%; border:none; border-radius:13px; padding:13px; font-family:"Baloo 2"; font-weight:800; font-size:16px; color:#fff; background:var(--teal); box-shadow:0 4px 12px rgba(47,150,135,.28); cursor:pointer; touch-action:none;}
  #pourBtn:active{transform:translateY(2px); box-shadow:0 2px 8px rgba(47,150,135,.24);}
  #pourBtn.done{background:#8fc4ba;} #pourBtn[disabled]{opacity:.5; filter:grayscale(.3);}
  .lv2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .lvRow{display:flex; align-items:center; gap:6px; background:#fffdf8; border:1.5px solid var(--line); border-radius:12px; padding:5px 7px;}
  .lvRow .lb{flex:none; font-size:11px; font-weight:800;}
  .lvBtn{border:none; width:26px; height:26px; border-radius:8px; background:var(--cream2); font-size:16px; font-weight:800; cursor:pointer; color:var(--ink);}
  .lvBtn:active{transform:scale(.9);}
  .lvVal{flex:1; text-align:center; font-weight:800; font-size:12px;}
  #clearBtn{width:100%; margin-top:11px; border:none; border-radius:13px; padding:11px; font-weight:800; font-size:14px; color:var(--dim); background:var(--cream2); cursor:pointer;}
  #clearBtn:active{transform:translateY(1px);}

  .ov{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; background:rgba(55,38,28,.46); backdrop-filter:blur(5px);}
  .ov.hidden{display:none;}
  .card{background:var(--cream); border-radius:22px; padding:24px 20px; max-width:380px; width:100%; box-shadow:0 18px 44px rgba(120,80,55,.26); margin:auto;}
  .card h1{font-family:"Baloo 2"; font-size:28px; margin:0 0 4px; color:var(--ink); letter-spacing:.5px; line-height:1.15; padding-top:.1em;}
  .card .emo{font-size:46px; margin-bottom:4px;}
  .card p{font-size:14px; line-height:1.5; color:#6b5443; margin:6px 0 16px;}
  .card p b{color:var(--pink);}
  .startcard{padding:30px 22px;}
  .starticon{display:flex; justify-content:center; margin-bottom:8px;}
  .card input{font-family:"Baloo 2"; font-size:19px; text-align:center; padding:12px; border-radius:14px; border:1.5px solid var(--line); background:#fff; color:var(--ink); width:100%; outline:none; margin-bottom:12px;}
  .card input:focus{border-color:var(--pink);}
  .bigbtn{font-family:"Baloo 2"; font-size:19px; font-weight:800; color:#fff; background:var(--pink); border:none; border-radius:16px; padding:15px 24px; cursor:pointer; box-shadow:0 6px 16px rgba(150,70,88,.28); width:100%; margin-top:8px;}
  .bigbtn:active{transform:translateY(2px); box-shadow:0 3px 10px rgba(150,70,88,.24);}
  /* hub */
  .hubcard{max-width:440px; padding:16px 14px 14px; max-height:94vh; display:flex; flex-direction:column;}
  .hubhead{text-align:left; margin-bottom:8px;}
  .hubhead .r1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .hubhead h2{margin:0; font-family:"Baloo 2"; font-size:19px;}
  .hubhead .vn{font-weight:800; color:#c07a2c; font-size:15px; white-space:nowrap;}
  .hubhead .rp{font-size:11px; color:var(--dim); font-weight:700;}
  .hubspecial{background:#fbf0d8; border-radius:11px; padding:7px 10px; font-size:12px; margin-top:7px; line-height:1.35;}
  .hubtabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; border-bottom:1.5px solid var(--line);}
  .hubtabs::-webkit-scrollbar{display:none;}
  .hubtab{flex:0 0 auto; border:none; background:transparent; border-radius:10px 10px 0 0; padding:7px 10px; font-weight:800; font-size:11px; color:var(--dim); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px; position:relative; top:1.5px;}
  .hubtab.on{background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-bottom:none;}
  .hubtab .e{font-size:17px;}
  .hubbody{flex:1; overflow-y:auto; text-align:left; min-height:140px; max-height:56vh; padding:10px 4px 4px;}
  .hubbody .intro{font-size:12px; color:#6b5443; margin:0 0 8px; line-height:1.45;}
  .secTitle{font-weight:800; font-size:13px; margin:12px 0 4px; display:flex; align-items:center; gap:6px;}
  .buyRow{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px dashed var(--line);}
  .buyRow .bi{width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; font-size:21px;}
  .buyRow .bt{flex:1; min-width:0;}
  .buyRow .bt .n{font-weight:800; font-size:14px;}
  .buyRow .bt .d{font-size:11px; color:var(--dim); line-height:1.25;}
  .cnt{display:flex; align-items:center; gap:5px;}
  .cntB{border:none; width:28px; height:28px; border-radius:8px; background:var(--cream2); font-size:16px; font-weight:800; cursor:pointer; color:var(--ink);}
  .cntB.pk{background:var(--pink); color:#fff;} .cntB[disabled]{opacity:.4;}
  .cntV{min-width:22px; text-align:center; font-weight:800;}
  .buyBtn{border:none; border-radius:10px; padding:7px 12px; font-weight:800; font-size:12px; background:var(--pink); color:#fff; cursor:pointer; white-space:nowrap;}
  .buyBtn[disabled]{background:#d8c7ad;} .buyBtn.own{background:#e3efdb; color:#4e8f44;}
  .sumRow{display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; padding:5px 2px; border-bottom:1px dashed var(--line);}
  .sumRow .big{font-size:17px;} .sumRow.tot{border:none;}
  .revItem{display:flex; gap:8px; padding:6px 2px; font-size:12.5px; border-bottom:1px dashed var(--line);}
  .revItem .ra{font-size:19px;} .revItem .rs{color:var(--gold); font-size:11px; letter-spacing:1px;}
  .revItem .rc{color:#6b5443;}
  .mini{font-size:11px; color:var(--dim); font-weight:700;}
  .pop{position:fixed; z-index:50; font-family:"Baloo 2"; font-weight:800; font-size:24px; pointer-events:none; animation:popUp 1.1s ease-out forwards;}
  @keyframes popUp{0%{opacity:1; transform:translate(-50%,0) scale(.8)}100%{opacity:0; transform:translate(-50%,-62px) scale(1.12)}}
  #flash{position:fixed; inset:0; z-index:35; pointer-events:none; opacity:0;}
  #flash.bad{background:#ff6b6b; animation:fl .4s;} #flash.good{background:#6bbf6a; animation:flg .4s;} #flash.star{background:#ffd45e; animation:flg .5s;}
  @keyframes fl{0%{opacity:.3}100%{opacity:0}} @keyframes flg{0%{opacity:.2}100%{opacity:0}}
  #mute{position:absolute; top:8px; right:10px; border:none; background:none; font-size:16px; cursor:pointer;}
  .warnbar{position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:30; max-width:520px; width:100%; text-align:center; font-weight:800; font-size:13px; color:#8a6a1a; background:rgba(251,240,216,.97); padding:9px; pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="awn"></div>
  <div id="top">
    <div class="tleft"><div id="shopName" class="display">Tiệm Trà Nhỏ</div><small id="dayState">Ngày 1 · Chuẩn bị</small></div>
    <div class="tmid"><div id="clock">11:00</div><small id="moneyV">400k</small></div>
    <div id="rep"><span id="repStars">★★★★★</span><span id="repNum">5.0 · 0 đánh giá</span></div>
  </div>
  <div id="chips">
    <span class="chip" id="chipCup">🥤 <b id="nCup">0</b></span>
    <span class="chip" id="chipTea">🫖 <b id="nTea">0</b></span>
    <span class="chip" id="chipTop">⚫ <b id="nTop">0</b></span>
    <span class="chip staff" id="chipStaff" style="display:none">🧑‍🍳</span>
    <span id="queueLeft"></span>
  </div>
  <div id="slots"></div>
  <div id="stage">
    <div class="cupBox">
      <div class="straw"></div>
      <div class="cup" id="cup">
        <div class="liquid" id="liquid"></div>
        <div class="mark" id="mark"></div>
        <div class="pearls" id="pearls"></div>
        <div class="empty" id="cupEmpty">Chưa chọn ly</div>
      </div>
      <div class="mixLbl" id="mixLbl">Ly đang pha</div>
      <div class="pourHint" id="pourHint"></div>
    </div>
  </div>
  <div id="build">
    <div class="step">① Chọn ly</div>
    <div class="opts sz" id="optSize"></div>
    <div class="step">② Chọn trà</div>
    <div class="opts tea" id="optTea"></div>
    <div class="step">③ Rót trà — giữ nút cho tới vạch</div>
    <button id="pourBtn">GIỮ ĐỂ RÓT</button>
    <div class="step">④ Topping</div>
    <div class="opts top" id="optTop"></div>
    <div class="step">⑤ Đường &amp; đá</div>
    <div class="lv2">
      <div class="lvRow"><span class="lb">🍬</span><button class="lvBtn" id="sugDn">−</button><span class="lvVal" id="sugVal">50%</span><button class="lvBtn" id="sugUp">+</button></div>
      <div class="lvRow"><span class="lb">🧊</span><button class="lvBtn" id="iceDn">−</button><span class="lvVal" id="iceVal">Vừa</span><button class="lvBtn" id="iceUp">+</button></div>
    </div>
    <button id="clearBtn">🗑️ Đổ ly, pha lại</button>
  </div>
</div>
<div id="flash"></div>
<div class="warnbar" id="warnbar" style="display:none"></div>

<div class="ov" id="startOv">
  <div class="card startcard">
    <button id="mute">🔊</button>
    <div class="starticon">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#b85a6e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 16 h20 l-1.9 23 a2 2 0 0 1 -2 1.8 h-10.2 a2 2 0 0 1 -2 -1.8 Z"/>
        <path d="M11.5 16 h25"/><path d="M30 16 l3 -7"/>
        <circle cx="20" cy="33" r="1.5" fill="#b85a6e" stroke="none"/><circle cx="24.5" cy="35" r="1.5" fill="#b85a6e" stroke="none"/><circle cx="28" cy="31.5" r="1.5" fill="#b85a6e" stroke="none"/>
      </svg>
    </div>
    <h1 class="display">Tiệm Trà Nhỏ</h1>
    <p>Nhập hàng, pha từng ly theo đơn của khách và mở tiệm nhỏ của riêng bạn.</p>
    <input id="shopInput" maxlength="16" placeholder="Tên quán của bạn" autocomplete="off" spellcheck="false">
    <button class="bigbtn" id="openBtn">Bắt đầu</button>
  </div>
</div>
<div class="ov hidden" id="hubOv"><div class="card hubcard">
  <div class="hubhead" id="hubHead"></div>
  <div class="hubtabs" id="hubTabs"></div>
  <div class="hubbody" id="hubBody"></div>
  <button class="bigbtn" id="hubGo">Mở cửa</button>
</div></div>
<div class="ov hidden" id="overOv"><div class="card" id="overCard"></div></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function rnd(n){return Math.floor(Math.random()*n);} function pick(a){return a[rnd(a.length)];}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function kstr(n){ n=Math.round(n); if(Math.abs(n)>=1000) return (n/1000).toFixed(n%1000?1:0).replace(/\.0$/,'')+"tr"; return n+"k"; }

  var SIZES=[{k:"M",name:"Ly M",extra:0,target:66},{k:"L",name:"Ly L",extra:7,target:82}];
  var TEAS=[
    {k:"milk",name:"Trà sữa",color:"#d8b88c",base:25,cost:0},{k:"matcha",name:"Matcha",color:"#9ac46a",base:30,cost:0},
    {k:"black",name:"Hồng trà",color:"#c06a46",base:28,cost:150},{k:"thai",name:"Trà Thái",color:"#e8853c",base:32,cost:300},
    {k:"green",name:"Lục trà",color:"#8ec56a",base:28,cost:150},{k:"olong",name:"Olong",color:"#c49a5e",base:28,cost:250}
  ];
  var TOPS=[
    {k:"none",name:"Không",color:null,price:0,cost:0},{k:"black",name:"TC đen",color:"#2d2620",price:6,cost:0},
    {k:"white",name:"TC trắng",color:"#efe6d2",price:5,cost:0},{k:"gold",name:"TC hoàng kim",color:"#e2a500",price:10,cost:120},
    {k:"pop",name:"TC popping",color:"#ff6f9a",price:9,cost:120},{k:"jelly",name:"Thạch",color:"#ff6b6b",price:7,cost:100}
  ];
  var SUGAR=[{v:0,l:"0%"},{v:30,l:"30%"},{v:50,l:"50%"},{v:70,l:"70%"},{v:100,l:"100%"}];
  var ICE=[{l:"Không đá",s:"Ko đá"},{l:"Ít đá",s:"Ít đá"},{l:"Đá vừa",s:"Vừa"},{l:"Nhiều đá",s:"Nhiều"}];
  var UPGRADES=[
    {k:"sign",name:"Biển đèn LED",emo:"💡",desc:"Thêm khách ghé (+2 khách/ngày).",cost:600,apply:function(){st.extraCust+=2;}},

      var sa=b.getAttribute("data-staff"); if(sa){ st.staff=(sa==="hire"); }
      var tk=b.getAttribute("data-tea"); if(tk){ var te=teaBy(tk); if(st.money<te.cost)return; st.money-=te.cost; st.teaUn[tk]=1; renderTeaOpts(); }
      var pk=b.getAttribute("data-top"); if(pk){ var tp=topBy(pk); if(st.money<tp.cost)return; st.money-=tp.cost; st.topUn[pk]=1; renderTopOpts(); }
      var uk=b.getAttribute("data-upg"); if(uk){ var u=null; for(var i=0;i<UPGRADES.length;i++)if(UPGRADES[i].k===uk)u=UPGRADES[i]; if(!u||st.money<u.cost)return; st.money-=u.cost; st.upg[uk]=1; u.apply(); }
      sTap(); updateTop(); updateChips(); renderHubHead(); renderHubBody();
    }; });
  }
  $("hubGo").onclick=function(){ au(); if(AC&&AC.state==="suspended")AC.resume(); $("hubOv").classList.add("hidden"); beginServe(); };

  // ====== serve phase (multi-slot) ======
  function PATmax(){ return Math.max(9, 20-st.day)+st.patBonus; }
  var OPEN=660, CLOSE=840, DAYSEC=80, GMPS=(CLOSE-OPEN)/DAYSEC;
  var clockMin=OPEN, closing=false, pendingSpawns=0, spawnAcc=0, spawnInt=6, dailyBusy=1, targetCust=0;
  function fmtClock(m){ var h=Math.floor(m/60), mm=Math.floor(m%60); return h+":"+(mm<10?"0":"")+mm; }
  function hasEmpty(){ for(var i=0;i<MAXSLOTS;i++) if(!slots[i]) return true; return false; }
  function placeCustomer(){ for(var i=0;i<MAXSLOTS;i++){ if(!slots[i]){ var pm=PATmax(); slots[i]={o:makeOrder(),patMax:pm,patLeft:pm}; return; } } }
  function beginServe(){ phase="serve"; $("dayState").textContent="Ngày "+st.day+" · Đang bán";
    resetSel(); markSel(); renderCup(); updatePour();
    slots=[null,null,null]; clockMin=OPEN; closing=false; pendingSpawns=targetCust; spawnInt=DAYSEC/Math.max(1,targetCust); spawnAcc=spawnInt*0.35;
    $("clock").textContent=fmtClock(OPEN); renderSlots(); updateTop(); updateChips(); startDayLoop();
    if(st.staff){ clearInterval(staffTimer); staffTimer=setInterval(staffTick,7000); } }
  function renderSlots(){
    var el=$("slots"); el.innerHTML="";
    for(var i=0;i<MAXSLOTS;i++){ (function(i){
      var s=slots[i]; var d=document.createElement("div");
      if(!s){ d.className="slot empty"; d.textContent="Trống"; el.appendChild(d); return; }
      d.className="slot"; var o=s.o;
      var tag = o.type==="picky"?'<span class="stg picky">Khó 🧐</span>':o.type==="rich"?'<span class="stg rich">Sộp 🤑</span>':'';
      d.innerHTML='<div class="sh"><span class="sav">'+o.ava+'</span><span class="sn">'+o.name+'</span>'+tag+'</div>'
        +'<div class="so">'+orderCardText(o)+'</div>'
        +'<div class="sbar"><i id="pb'+i+'" style="width:'+Math.max(0,s.patLeft/s.patMax*100)+'%"></i></div>'
        +'<div class="sbt"><button class="give">Giao ly</button><button class="rej">Từ chối</button></div>';
      d.querySelector(".give").onclick=function(){ au(); serveTo(i); };
      d.querySelector(".rej").onclick=function(){ au(); rejectSlot(i); };
      el.appendChild(d);
    })(i); }
  }
  function startDayLoop(){ stopSlotLoop(); var last=performance.now();
    function tick(now){ if(phase!=="serve"){ slotRaf=null; return; } var dt=(now-last)/1000; last=now; if(dt>0.25)dt=0.25;
      if(!closing){ clockMin+=dt*GMPS; if(clockMin>=CLOSE){ clockMin=CLOSE; closing=true; $("dayState").textContent="Ngày "+st.day+" · Dọn quán"; updateChips(); }
        $("clock").textContent=fmtClock(clockMin); spawnAcc+=dt;
        while(pendingSpawns>0 && spawnAcc>=spawnInt){ if(hasEmpty()){ placeCustomer(); pendingSpawns--; renderSlots(); updateChips(); spawnAcc-=spawnInt*(0.6+Math.random()*0.8); } else { break; } } }
      for(var i=0;i<MAXSLOTS;i++){ var s=slots[i]; if(!s)continue; s.patLeft-=dt;
        var bar=$("pb"+i); if(bar){ var f=Math.max(0,s.patLeft/s.patMax); bar.style.width=(f*100)+"%";
          bar.style.background= f>0.5?"linear-gradient(90deg,#7fd17a,#56b85a)":f>0.25?"linear-gradient(90deg,#f5c242,#e89b1e)":"linear-gradient(90deg,#ff7a7a,#e74c3c)"; }
        if(s.patLeft<=0){ slotLeave(i); } }
      if(closing && slots.every(function(s){return !s;})){ endDay(); return; }
      slotRaf=requestAnimationFrame(tick); }
    slotRaf=requestAnimationFrame(tick);
  }
  function stopSlotLoop(){ if(slotRaf){cancelAnimationFrame(slotRaf);slotRaf=null;} }

  function haveStock(o){ return st.stock.cup>0 && st.stock.tea>0 && (o.top==="none"||st.stock.top>0); }
  function consumeStock(o){ st.stock.cup--; st.stock.tea--; if(o.top!=="none")st.stock.top--; updateChips(); }
  function drinkPrice(o){ return teaBy(o.tea).base + sizeBy(o.size).extra + topBy(o.top).price; }

  function serveTo(i){
    if(phase!=="serve")return; var s=slots[i]; if(!s)return; var o=s.o;
    if(!sel.size||!sel.tea||!sel.poured){ flash("bad"); sBad(); warn("Chưa pha xong: chọn ly, trà và RÓT!"); return; }
    if(sel.top===null){ flash("bad"); sBad(); warn("Chọn topping (hoặc 'Không')!"); return; }
    if(!haveStock(o)){ flash("bad"); sBad(); warn("Hết nguyên liệu! Mai nhập thêm."); return; }
    var tgt=sizeBy(sel.size).target, diff=Math.abs(sel.fill-tgt);
    var pourPerfect=diff<=6+st.pourTol, pourOk=diff<=13+st.pourTol;
    var okTea=sel.tea===o.tea, okSize=sel.size===o.size, okTop=(sel.top||"none")===o.top;
    var okSugar=!o.reqSugar||sel.sugar===o.sugar, okIce=!o.reqIce||sel.ice===o.ice;
    consumeStock(o); dayServed++; slots[i]=null;
    if(!okTea||!okSize||!pourOk){ st.combo=0; addReview(o, okTea&&okSize?2:1);
      flash("bad"); sBad(); popTxt("Sai món! 💔","#e74c3c"); adjustRep(-0.3); afterServe(); return; }
    var allPerfect=okTop&&okSugar&&okIce&&pourPerfect;
    if(o.type==="picky"&&!allPerfect){ st.combo=0; var g0=Math.round(drinkPrice(o)*0.7);
      st.money+=g0; dayRev+=g0; addReview(o,3); flash("bad"); popTxt("+"+kstr(g0)+" 😐","#c07a2c"); sGood(); adjustRep(-0.05); afterServe(); return; }
    var price=drinkPrice(o), tip=0;
    if(allPerfect){ st.combo++; dayPerfect++; tip=Math.min(12,st.combo*2)+(pourPerfect?4:0); if(o.type==="rich")tip=Math.round(tip*3+10); } else st.combo=0;
    tip=Math.round(tip*st.tipMul);
    var gain=price+tip; st.money+=gain; dayRev+=gain;
    var isSpecial=(o.tea===special.tea&&o.size===special.size&&o.top===special.top);
    if(isSpecial&&!specialDone){ specialDone=true; st.money+=40; dayRev+=40; flash("star"); popTxt("⭐ ĐẶC BIỆT +40k","#c79400"); sPerfect(); }
    else if(allPerfect){ flash("good"); sPerfect(); popTxt("+"+kstr(gain)+(st.combo>1?" 🔥x"+st.combo:""),"#2e9e4f"); }
    else { flash("good"); sGood(); popTxt("+"+kstr(gain),"#2e9e4f"); }
    addReview(o, allPerfect?5:4); adjustRep(allPerfect?0.06:0.02); updateTop(); afterServe();
  }
  function afterServe(){ resetSel(); markSel(); renderCup(); updatePour(); renderSlots(); updateChips(); maybeEnd(); }
  function rejectSlot(i){ if(phase!=="serve")return; var s=slots[i]; if(!s)return;
    st.combo=0; dayServed++; addReview(s.o,2); adjustRep(-0.15); popTxt("Từ chối 🙇","#c07a2c"); slots[i]=null; renderSlots(); updateChips(); maybeEnd(); }
  function slotLeave(i){ var s=slots[i]; if(!s)return; st.combo=0; dayLeft++; dayServed++; addReview(s.o,1);
    flash("bad"); beep(300,0.2,"sine",0.07); popTxt("Khách bỏ đi 😤","#e74c3c"); adjustRep(-0.4); slots[i]=null; renderSlots(); updateTop(); updateChips(); maybeEnd(); }
  function staffTick(){ if(phase!=="serve")return; var best=-1,bl=1e9;
    for(var i=0;i<MAXSLOTS;i++){ if(slots[i]&&slots[i].patLeft<bl&&haveStock(slots[i].o)){ bl=slots[i].patLeft; best=i; } }
    if(best<0)return; var o=slots[best].o; consumeStock(o); dayServed++; var price=drinkPrice(o); st.money+=price; dayRev+=price;
    addReview(o,4); adjustRep(0.01); popTxt("🧑‍🍳 NV +"+kstr(price),"#4e8f44"); slots[best]=null; updateTop(); renderSlots(); updateChips(); maybeEnd(); }
  function maybeEnd(){ if(closing && slots.every(function(s){return !s;})) endDay(); }
  function addReview(o,stars){ st.revCount++; var c=pick(REVIEWS[stars]||REVIEWS[3]);
    st.reviews.unshift({name:o.name,ava:o.ava,stars:stars,text:c}); if(st.reviews.length>12)st.reviews.pop(); }
  function adjustRep(d){ st.rep=clamp(st.rep+d,0,5); }

  function endDay(){
    phase="summary"; stopSlotLoop(); clearInterval(staffTimer);
    var rent=50, util=20+Object.keys(st.upg).length*5, wage=st.staff?STAFF.wage:0;
    var waste=st.stock.cup+st.stock.tea+st.stock.top;
    st.money-=(rent+util+wage);
    var net=dayRev-dayStockCost-rent-util-wage;
    lastRecap={day:st.day,rev:dayRev,stockCost:dayStockCost,rent:rent,util:util,wage:wage,waste:waste,net:net,served:dayServed,perfect:dayPerfect,left:dayLeft,rep:st.rep,reviews:st.reviews.slice(0,3)};
    st.stock={cup:0,tea:0,top:0}; updateChips();
    if(st.money<0){ gameOver("Hết vốn rồi! Quán phải đóng cửa 💸"); return; }
    if(st.rep<2.0){ gameOver("Uy tín quá thấp, khách không tới nữa 😢"); return; }
    st.day++; enterMorning();
  }
  function gameOver(msg){ phase="over"; stopSlotLoop(); clearInterval(staffTimer); $("hubOv").classList.add("hidden");
    $("overCard").innerHTML='<div class="emo">😢</div><h1 class="display" style="font-size:23px">Quán đóng cửa…</h1><p>'+msg+'</p>'
      +'<div class="sumRow"><span>Trụ được</span><span>'+st.day+' ngày</span></div>'
      +'<div class="sumRow" style="border:none"><span>Uy tín cuối</span><span style="color:#e0a53a">'+st.rep.toFixed(1)+' ⭐ · '+st.revCount+' đánh giá</span></div>'
      +'<button class="bigbtn" id="againBtn">🔁 Mở quán lại</button>';
    $("overCard").querySelector("#againBtn").onclick=function(){ $("overOv").classList.add("hidden"); initGame(); };
    $("overOv").classList.remove("hidden");
  }

  function repStars(r){ var full=Math.round(r); return "★★★★★".slice(0,full)+"☆☆☆☆☆".slice(0,5-full); }
  function updateTop(){ $("moneyV").textContent=kstr(st.money);
    $("repStars").textContent=repStars(st.rep); $("repNum").textContent=st.rep.toFixed(1)+" · "+st.revCount+" đánh giá"; }
  function updateChips(){ $("nCup").textContent=st.stock.cup; $("nTea").textContent=st.stock.tea; $("nTop").textContent=st.stock.top;
    $("chipCup").classList.toggle("low",st.stock.cup<=1); $("chipTea").classList.toggle("low",st.stock.tea<=1); $("chipTop").classList.toggle("low",st.stock.top<=1);
    $("chipStaff").style.display=st.staff?"inline-flex":"none";
    $("queueLeft").textContent = phase==="serve" ? (closing?"🧹 Đang dọn quán":("🕐 đóng cửa "+fmtClock(CLOSE))) : ""; }
  function flash(k){ var f=$("flash"); f.className=""; void f.offsetWidth; f.className=k; }
  function popTxt(t,c){ var el=document.createElement("div"); el.className="pop"; el.textContent=t; el.style.color=c; el.style.left="50%"; el.style.top="40%"; el.style.transform="translate(-50%,0)"; document.body.appendChild(el); setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1100); }
  var warnT=null;
  function warn(t){ var w=$("warnbar"); w.textContent="⚠️ "+t; w.style.display="block"; clearTimeout(warnT); warnT=setTimeout(function(){w.style.display="none";},1600); }

  function initGame(){
    st={ shop:st.shop, day:1, money:400, rep:5.0, revCount:0, combo:0, teaUn:{milk:1,matcha:1}, topUn:{none:1,black:1,white:1}, upg:{}, staff:false,
      extraCust:0, patBonus:0, pourTol:0, tipMul:1.0, stock:{cup:0,tea:0,top:0}, reviews:[] };
    lastRecap=null; $("shopName").textContent=st.shop;
    buildServeUI(); resetSel(); markSel(); renderCup(); updatePour(); updateTop(); updateChips(); enterMorning();
  }
  $("openBtn").onclick=function(){ au(); if(AC&&AC.state==="suspended")AC.resume(); var v=($("shopInput").value||"").trim(); if(v)st.shop=v.slice(0,16); $("startOv").classList.add("hidden"); initGame(); };
  $("shopInput").addEventListener("keydown",function(e){ if(e.key==="Enter")$("openBtn").click(); });
  buildServeUI(); resetSel(); markSel(); renderCup(); updatePour();
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
</body>
