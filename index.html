<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>TIỆM TRÀ NHỎ — Pha trà sữa &amp; quản lý quán</title>
<meta name="theme-color" content="#f6eee0">
<meta name="description" content="Game pha trà sữa cozy: rót trà tới vạch, thêm đường đá topping theo đơn, phục vụ nhiều khách, nhập kho và mở rộng quán.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiệm Trà Nhỏ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#f6eee0; --cream2:#ece0ca; --ink:#4f3d30; --dim:#a08a73; --pink:#b85a6e; --pink2:#cf8291; --pinkbg:#f4e6e8; --green:#6fae63; --line:#e9ddc7; --card:#fffaf0; --gold:#e0a53a; --red:#d1564e; --teal:#3faa9a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; height:100%; overflow:hidden; background:#e8dcc7; color:var(--ink); font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; user-select:none; touch-action:manipulation;}
  .display{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;}
  #wrap{position:fixed; inset:0; display:flex; flex-direction:column; max-width:520px; margin:0 auto; background:var(--cream) url('assets/bg_shop.png') top center / cover no-repeat; box-shadow:0 0 60px rgba(150,110,80,.2);}
  #wrap::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(180deg, #f6eee0 0%, #f6eee0 31%, rgba(246,238,224,.6) 41%, rgba(246,238,224,.6) 50%, rgba(246,238,224,.9) 66%, rgba(246,238,224,.99) 80%);}
  #awn{display:none;}
  #mascot{position:absolute; left:4px; bottom:6px; height:98px; width:auto; z-index:4; pointer-events:none; filter:drop-shadow(0 4px 5px rgba(90,60,35,.28)); transition:transform .15s;}
  #stage .cupBox{z-index:2;}
  #top{flex:none; display:flex; align-items:center; gap:8px; padding:9px 14px 7px;}
  .stat{display:flex; flex-direction:column; line-height:1.05;}
  .stat .k{font-size:9px; color:var(--dim); font-weight:700; text-transform:uppercase; letter-spacing:1px;}
  .stat .v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  #shopName{font-weight:800; font-size:15px;}
  .tleft{display:flex; flex-direction:column; line-height:1.14; min-width:0; flex:1;}
  .tleft small{font-size:10px; color:var(--dim); font-weight:700;}
  .tmid{text-align:center; line-height:1.06;}
  #clock{font-family:"Baloo 2",sans-serif; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .tmid small{font-size:12px; font-weight:800; color:#c07a2c;}
  #money .v{color:#c07a2c;}
  #rep{display:flex; flex-direction:column; align-items:flex-end; line-height:1.05;}
  #repStars{color:var(--gold); font-size:13px; letter-spacing:1px;}
  #repNum{font-size:10px; color:var(--dim); font-weight:700;}
  #chips{flex:none; display:flex; gap:6px; padding:0 14px 8px; font-size:11px; font-weight:800; color:var(--ink); align-items:center;}
  .chip{background:var(--cream2); border-radius:999px; padding:3px 9px; display:inline-flex; gap:4px; align-items:center;}
  .chip.low{background:#f6dcd9; color:var(--red);} .chip.staff{background:#e3efdb; color:#4e8f44;}
  .chip.gear{border:none; cursor:pointer; font-size:14px; padding:3px 9px; color:var(--ink);} .chip.gear:active{transform:scale(.92);}
  #queueLeft{flex:1; text-align:right; color:var(--dim); font-weight:700;}

  /* customer slots */
  #slots{flex:none; display:flex; gap:7px; padding:0 12px 6px;}
  .slot{flex:1; min-width:0; background:linear-gradient(#fffaf1,#fff2e0); border:1.5px solid #ecd9b8; border-radius:15px; padding:8px 8px 9px; display:flex; flex-direction:column; gap:5px; box-shadow:0 3px 10px rgba(150,110,70,.13), inset 0 1px 0 rgba(255,255,255,.6);}
  .slot.empty{border:1.5px dashed #ddc8a4; align-items:center; justify-content:center; color:#bba98a; font-weight:800; font-size:10.5px; box-shadow:none; background:rgba(255,252,246,.5); gap:1px; padding:10px 6px;}
  .slot.empty .eghost{font-size:19px; opacity:.45; line-height:1;}
  .slot.active{border-color:var(--pink); box-shadow:0 2px 12px rgba(184,90,110,.18);}
  .slot .sh{display:flex; align-items:center; gap:6px;}
  .slot .sav{width:28px; height:28px; flex:none; display:flex; align-items:center; justify-content:center;}
  .slot .sn{font-weight:800; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
  .slot .stg{font-size:9px; font-weight:800; padding:1px 5px; border-radius:999px;}
  .slot .stg.picky{background:#f6dcd9; color:var(--red);} .slot .stg.rich{background:#fbeecb; color:#a8781a;}
  .slot .so{font-size:10.5px; font-weight:600; line-height:1.32; color:var(--ink); min-height:40px;}
  .slot .so b{color:var(--pink);}
  .slot .sbar{height:6px; border-radius:999px; background:#eadcc4; overflow:hidden;}
  .slot .sbar i{display:block; height:100%; border-radius:999px; width:100%; background:linear-gradient(90deg,#7fd17a,#56b85a);}
  .slot .sfbar{margin-top:3px; background:#d7e6ff;}
  .slot .sfbar i{background:linear-gradient(90deg,#7aa7ff,#4e82e8);}
  .slot .sfwrap{display:flex; align-items:center; gap:2px; margin-top:4px;}
  .slot .sfstep{opacity:.25; filter:grayscale(1); font-size:12px; transition:.15s;}
  .slot .sfstep.on{opacity:1; filter:none;}
  .slot .sfstep.now{transform:scale(1.3) translateY(-1px);}
  .slot .sflbl{font-size:9px; font-weight:800; color:#3f6fd1; margin-left:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;}
  .slot .sfcup{position:relative; width:13px; height:17px; background:#fffdf8; border:1.5px solid #dcc29c; border-radius:2px 2px 4px 4px; overflow:hidden; display:inline-block; vertical-align:middle; flex:none;}
  .slot .sfcup i{position:absolute; left:0; right:0; bottom:0; height:0; background:#d8b88c; transition:height .12s;}
  .slot .sfcup b{position:absolute; left:50%; bottom:1px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:#2d2620; display:none; z-index:2;}
  .slot .sbt{display:flex; gap:5px;}
  .slot .sbt button{flex:1; border:none; border-radius:9px; padding:7px 4px; font-weight:800; font-size:11px; cursor:pointer;}
  .slot .give{background:var(--pink); color:#fff;} .slot .give:active{transform:scale(.96);}
  .slot .rej{background:var(--cream2); color:var(--dim);} .slot .rej:active{transform:scale(.96);}

  /* mixing cup */
  #stage{flex:1; display:flex; align-items:center; justify-content:center; gap:14px; padding:22px 12px 8px; min-height:118px; overflow:hidden; position:relative; margin:4px 8px 3px; border-radius:18px; background:linear-gradient(rgba(255,251,243,.5),rgba(253,247,236,.66)); box-shadow:inset 0 0 0 1.5px rgba(214,190,150,.45), 0 3px 10px rgba(150,110,70,.1);}
  #stage::after{content:""; position:absolute; left:50%; bottom:14px; width:116px; height:13px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(ellipse at center,rgba(150,110,70,.18),rgba(150,110,70,0) 72%); z-index:0;}
  .stageTag{position:absolute; top:7px; left:11px; z-index:5; background:linear-gradient(#bd8e5e,#a3764b); color:#fff5e6; border:1.5px solid #875c37; border-radius:8px; padding:3px 10px; font-size:9.5px; font-weight:800; letter-spacing:.6px; box-shadow:0 2px 0 #7a5331, inset 0 1px 0 rgba(255,255,255,.28); text-shadow:0 1px 1px rgba(90,55,25,.4);}
  .cupBox{display:flex; flex-direction:column; align-items:center; gap:3px;}
  .cup{position:relative; width:68px; height:92px; background:#fffdf8; border:3px solid #e8dcc4; clip-path:polygon(14% 0,86% 0,77% 100%,23% 100%); overflow:hidden; transition:height .15s, width .15s;}
  .cup.L{width:78px; height:106px;}
  .cup .liquid{position:absolute; left:0; right:0; bottom:0; height:0; background:#e9dcc4; transition:background .15s;}
  .cup .mark{position:absolute; left:-2px; right:-2px; border-top:2px dashed var(--teal); opacity:0; z-index:3;}
  .cup .mark.on{opacity:.9;}
  .cup .pearls{position:absolute; left:8%; right:8%; bottom:3px; display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-items:flex-end;}
  .cup .pearls i{width:10px; height:10px; border-radius:50%; display:block; box-shadow:0 1px 1px rgba(0,0,0,.28), inset 0 -2px 2px rgba(0,0,0,.18);}
  .cup .pearls i.jel{width:9px; height:9px; border-radius:3px; opacity:.92;}
  .cup .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#c9b89a; text-align:center; font-weight:700; padding:0 8px;}
  .straw{width:7px; height:34px; border-radius:4px; background:var(--pink2); margin:-10px auto 0; position:relative; z-index:2; transform:rotate(10deg);}
  .mixLbl{font-size:11px; color:var(--dim); font-weight:800;}
  .pourHint{font-size:10px; color:var(--teal); font-weight:800;}

  /* builder */
  #counter{flex:none; border-top:2px solid #cdae82; background-color:#ecdbbd; background-image:repeating-linear-gradient(0deg,rgba(180,140,90,.10) 0 1px,transparent 1px 21px),repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 20px,rgba(150,110,65,.08) 20px 22px); border-radius:18px 18px 0 0; padding:9px 10px 12px; overflow-y:auto; max-height:56vh; box-shadow:0 -5px 18px rgba(120,80,45,.14), inset 0 2px 0 rgba(255,255,255,.5); display:flex; flex-direction:column; gap:8px;}
  .cboard{background:linear-gradient(#fffaf0,#fff3e1); border:1.5px solid #e7d3ae; border-radius:14px; padding:7px 9px 9px; box-shadow:0 2px 7px rgba(150,110,70,.12), inset 0 1px 0 rgba(255,255,255,.65);}
  .cLabel{display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap;}
  .plaque{display:inline-block; background:linear-gradient(#bd8e5e,#a3764b); color:#fff5e6; border:1.5px solid #875c37; border-radius:8px; padding:3px 11px; font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; box-shadow:0 2px 0 #7a5331, inset 0 1px 0 rgba(255,255,255,.28); white-space:nowrap; text-shadow:0 1px 1px rgba(90,55,25,.4);}
  .cHint{color:#8a7250; text-transform:none; letter-spacing:0; font-weight:700; font-size:10px;}
  .qtRow{display:flex; gap:7px; align-items:stretch;}
  .cups{flex:none; display:flex; flex-direction:row; gap:4px;}
  .cups .opt{padding:4px 5px; min-width:46px;}
  .teaScroll{flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; padding-bottom:5px; border-bottom:4px solid; border-image:linear-gradient(90deg,#d9b98c,#c79e6e,#d9b98c) 1; border-radius:0 0 4px 4px;}
  .teaScroll::-webkit-scrollbar{display:none;}
  .teaBar{display:flex; gap:5px; width:max-content; min-width:100%;}
  .teaBar .opt{flex:0 0 auto; width:66px; padding:5px 2px; touch-action:none; position:relative;}
  .machine{flex:none; width:38px; display:flex; align-items:center; justify-content:center;}
  .plRow{display:flex; gap:8px; align-items:stretch;}
  .woodBoard{flex:none; width:70px; background:linear-gradient(#caa06a,#b08650); border:2px solid #8a6238; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#fff6e8; font-weight:800; font-size:11px; text-align:center; box-shadow:inset 0 0 0 3px rgba(255,240,220,.18), 0 2px 5px rgba(120,80,45,.2); text-shadow:0 1px 1px rgba(90,55,25,.5); padding:4px;}
  .woodBoard b{font-size:14px; font-family:"Baloo 2";}
  .trayGrid{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:2px;}
  .bottleRow{display:flex; gap:6px; justify-content:center; margin-top:8px; padding-top:6px; border-top:1px dashed #e3d2b0;}
  .teaBar .opt.sel{border-color:var(--teal); background:#e3f3ef; box-shadow:0 0 0 2px rgba(63,170,154,.25);}
  .teaBar .opt .dn{font-size:10.5px; line-height:1.05;}
  .teaBar .opt.pouring{border-color:var(--teal); background:#d4efe9; transform:scale(.97);}
  .trayGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; padding:4px; background:linear-gradient(#eef2f4,#c3cbcf 55%,#aab2b8); border:2px solid #949ca3; border-radius:8px; box-shadow:inset 0 2px 6px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.4), 0 3px 8px rgba(120,80,45,.2);}
  .trayGrid .opt{padding:0; position:relative;}
  .trayEmpty{cursor:default; opacity:.6;} .trayEmpty:active{transform:none;}
  .trayGrid .opt.sel{border-color:var(--pink); background:var(--pinkbg);}
  .trayq{position:absolute; top:3px; right:5px; font-size:9px; font-weight:800; color:#5c6b74; background:#eef2f4; border:1px solid #cfd6db; border-radius:8px; padding:0 4px; line-height:1.4;}
  .opt.soldout{position:relative; opacity:.45; filter:grayscale(.55);}
  .opt.soldout span,.opt.soldout .dn{text-decoration:line-through;}
  .opt.soldout::after{content:"Hết"; position:absolute; top:2px; left:4px; font-size:8px; font-weight:800; color:#d1564e; background:#f6dcd9; border-radius:6px; padding:0 4px; text-decoration:none;}
  .addRow{display:flex; gap:7px; align-items:stretch;}
  .lvlRow{display:flex; gap:5px;}
  .lvlb{flex:1; border:1.5px solid var(--line); background:#fffdf8; border-radius:10px; padding:8px 2px; font-weight:800; font-size:12px; color:var(--ink); cursor:pointer; line-height:1.1;}
  .lvlb.on{border-color:var(--pink); background:var(--pinkbg); box-shadow:0 0 0 2px rgba(184,90,110,.2); color:var(--pink);}
  .lvlb:active{transform:scale(.95);}
  .tray2{flex:1; background:#fffdf8; border:1.5px solid var(--line); border-radius:12px; padding:4px 6px 5px; display:flex; flex-direction:column; gap:3px; align-items:center;}
  .tray2 .t2l{font-size:10px; font-weight:800; color:var(--dim);}
  .tray2 .t2c{display:flex; align-items:center; gap:5px;}
  .bucket{flex:none; width:62px; border:1.5px solid var(--line); border-radius:12px; background:var(--cream2); font-size:22px; color:var(--dim); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
  .bucket span{font-size:9px; font-weight:800; margin-top:1px;}
  .bucket:active{transform:scale(.95);}
  .step{font-size:10px; font-weight:800; color:var(--dim); letter-spacing:.3px; margin:5px 2px 3px; text-transform:uppercase;}
  .step:first-child{margin-top:1px;}
  .opts{display:grid; gap:6px;}
  .opts.sz{grid-template-columns:repeat(2,1fr);} .opts.tea{grid-template-columns:repeat(3,1fr);} .opts.top{grid-template-columns:repeat(3,1fr);}
  .opt{border:1.5px solid var(--line); background:#fffdf8; border-radius:12px; padding:5px 3px; cursor:pointer; font-weight:700; font-size:12px; color:var(--ink); text-align:center; display:flex; flex-direction:column; align-items:center; gap:1px; transition:.1s; line-height:1.1;}
  .opt:active{transform:scale(.95);}
  .opt.sel{border-color:var(--pink); background:var(--pinkbg); box-shadow:0 0 0 2px rgba(184,90,110,.2);}
  .opt .px{font-size:9px; color:var(--dim); font-weight:700;}
  .opt .ic2{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));}
  .pourRow{display:flex; gap:8px; align-items:stretch;}
  #pourBtn{flex:1; border:none; border-radius:13px; padding:11px; font-family:"Baloo 2"; font-weight:800; font-size:15px; color:#fff; background:var(--teal); box-shadow:0 4px 12px rgba(47,150,135,.28); cursor:pointer; touch-action:none;}
  #pourBtn:active{transform:translateY(2px); box-shadow:0 2px 8px rgba(47,150,135,.24);}
  #pourBtn.done{background:#8fc4ba;} #pourBtn[disabled]{opacity:.5; filter:grayscale(.3);}
  .lv2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .lvRow{display:flex; align-items:center; gap:6px; background:#fffdf8; border:1.5px solid var(--line); border-radius:12px; padding:5px 7px;}
  .lvRow .lb{flex:none; font-size:11px; font-weight:800;}
  .lvBtn{border:none; width:26px; height:26px; border-radius:8px; background:var(--cream2); font-size:16px; font-weight:800; cursor:pointer; color:var(--ink);}
  .lvBtn:active{transform:scale(.9);}
  .lvVal{flex:1; text-align:center; font-weight:800; font-size:12px;}

  .ov{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; background:rgba(55,38,28,.46); backdrop-filter:blur(5px);}
  .ov.hidden{display:none;}
  .card{background:var(--cream); border-radius:22px; padding:24px 20px; max-width:380px; width:100%; box-shadow:0 18px 44px rgba(120,80,55,.26); margin:auto;}
  .card h1{font-family:"Baloo 2"; font-size:28px; margin:0 0 4px; color:var(--ink); letter-spacing:.5px; line-height:1.15; padding-top:.1em;}
  .card .emo{font-size:46px; margin-bottom:4px;}
  .card p{font-size:14px; line-height:1.5; color:#6b5443; margin:6px 0 16px;}
  .card p b{color:var(--pink);}
  .startcard{padding:30px 22px;}
  .starticon{display:flex; justify-content:center; margin-bottom:8px;}
  .card input{font-family:"Baloo 2"; font-size:19px; text-align:center; padding:12px; border-radius:14px; border:1.5px solid var(--line); background:#fff; color:var(--ink); width:100%; outline:none; margin-bottom:12px;}
  .card input:focus{border-color:var(--pink);}
  .bigbtn{font-family:"Baloo 2"; font-size:19px; font-weight:800; color:#fff; background:var(--pink); border:none; border-radius:16px; padding:15px 24px; cursor:pointer; box-shadow:0 6px 16px rgba(150,70,88,.28); width:100%; margin-top:8px;}
  .bigbtn:active{transform:translateY(2px); box-shadow:0 3px 10px rgba(150,70,88,.24);}
  /* hub */
  #hubOv{background:linear-gradient(#efe0c6,#e6d4b4); backdrop-filter:none; padding:0;}
  .hubcard{max-width:520px; width:100%; height:100%; max-height:100%; border-radius:0; box-shadow:0 0 50px rgba(150,110,80,.18); margin:0 auto; padding:12px 14px; display:flex; flex-direction:column;}
  .hubhead{text-align:left; margin-bottom:8px;}
  .hubhead .r1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .hubhead h2{margin:0; font-family:"Baloo 2"; font-size:19px; color:#6b4a2e;}
  .hubhead .vn{font-weight:800; color:#c07a2c; font-size:15px; white-space:nowrap;}
  .hubhead .rp{font-size:11px; color:var(--dim); font-weight:700;}
  .hubspecial{background:#fbf0d8; border-radius:11px; padding:7px 10px; font-size:12px; margin-top:7px; line-height:1.35;}
  .menuboard{background:linear-gradient(#fffaf0,#fff2df); border:2px solid #cdae82; border-radius:14px; padding:9px 12px; margin:8px 0 4px; text-align:left; box-shadow:0 3px 9px rgba(150,110,70,.14), inset 0 0 0 3px rgba(255,248,236,.9);}
  .menuboard .mbh{font-weight:800; font-size:13px; margin-bottom:5px; color:#8a5f3a;}
  .menuboard .mbgrid{display:grid; grid-template-columns:1fr 1fr; gap:1px 16px;}
  .menuboard .mbrow{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; border-bottom:1px dotted var(--line); padding:2px 0;}
  .menuboard .mbrow b{color:#c07a2c; font-weight:800;}
  .menuboard .mbtops{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;}
  .menuboard .mbchip{font-size:10.5px; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px 8px;}
  .menuboard .mbfoot{font-size:10.5px; color:var(--dim); font-weight:700; margin-top:6px;}
  .hubtabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; border-bottom:1.5px solid #ddc69e;}
  .hubtabs::-webkit-scrollbar{display:none;}
  .hubtab{flex:0 0 auto; border:none; background:transparent; border-radius:10px 10px 0 0; padding:7px 10px; font-weight:800; font-size:11px; color:var(--dim); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px; position:relative; top:1.5px;}
  .hubtab.on{background:linear-gradient(#fffaf0,#fff2df); color:var(--ink); border:1.5px solid #e0cba3; border-bottom:none; box-shadow:0 -2px 6px rgba(150,110,70,.1);}
  .hubtab .e{font-size:17px;}

    slotRaf=requestAnimationFrame(tick);
  }
  function stopSlotLoop(){ if(slotRaf){cancelAnimationFrame(slotRaf);slotRaf=null;} }

  function haveStockFor(size,teaK,top){ return st.stock.cup>=1 && teaQ(teaK)>=teaUse(size)-1e-9 && (!top||top==="none"||topQ(top)>=1); }
  function consumeStock(size,teaK,top){ st.stock.cup=Math.max(0,st.stock.cup-1); if(st.stock.teas[teaK])st.stock.teas[teaK].q=Math.max(0,Math.round((st.stock.teas[teaK].q-teaUse(size))*100)/100); if(top&&top!=="none"&&st.stock.tops[top])st.stock.tops[top].q=Math.max(0,st.stock.tops[top].q-1); updateChips(); }
  function drinkPrice(o){ var p=sellP(o.tea) + (o.size==="L"?sellP("L"):0) + (o.top!=="none"?sellP(o.top):0); return Math.round(p*(st.promoOn?0.85:1)); }

  function serveTo(i){
    if(phase!=="serve")return; var s=slots[i]; if(!s)return; var o=s.o;
    if(!sel.size||!sel.tea||!sel.poured){ flash("bad"); sBad(); warn("Chưa pha xong: chọn ly, trà và RÓT!"); return; }
    if(sel.top===null){ flash("bad"); sBad(); warn("Chọn topping (hoặc 'Không')!"); return; }
    if(!haveStockFor(sel.size,sel.tea,sel.top)){ flash("bad"); sBad(); warn("Hết nguyên liệu! Nhập ở tab Kho."); return; }
    var tgt=sizeBy(sel.size).target, diff=Math.abs(sel.fill-tgt);
    var pourPerfect=diff<=6+st.pourTol, pourOk=diff<=13+st.pourTol;
    var okTea=sel.tea===o.tea, okSize=sel.size===o.size, okTop=(sel.top||"none")===o.top;
    var okSugar=!o.reqSugar||sel.sugar===o.sugar, okIce=!o.reqIce||sel.ice===o.ice;
    var madeTea=sel.tea, madeTop=sel.top; consumeStock(sel.size,sel.tea,sel.top); dayServed++;
    var last=(s.served+1>=o.qty); s.served++;
    if(!okTea||!okSize||!pourOk){ st.combo=0; dayBad++;
      flash("bad"); sBad(); popTxt("Sai ly! 💔","#e74c3c"); adjustRep(-0.3); setMascot("sad",1400);
      if(last) finishCustomer(i,o,okTea&&okSize?2:1); else nextCup(o); return; }
    var allPerfect=okTop&&okSugar&&okIce&&pourPerfect;
    if(o.type==="picky"&&!allPerfect){ st.combo=0; var g0=Math.round(drinkPrice(o)*0.7);
      st.money+=g0; dayRev+=g0; daySuccess++; daySales[o.tea]=(daySales[o.tea]||0)+1; discoverCombo(madeTea,madeTop);
      flash("bad"); popTxt("+"+kstr(g0)+" 😐","#c07a2c"); sGood(); adjustRep(-0.05);
      if(last) finishCustomer(i,o,3); else nextCup(o); return; }
    var price=drinkPrice(o), tip=0; if(o.online)price=Math.round(price*0.82);
    if(allPerfect){ st.combo++; dayPerfect++; tip=Math.min(12,st.combo*2)+(pourPerfect?4:0); if(o.type==="rich")tip=Math.round(tip*3+10); } else st.combo=0;
    tip=Math.round(tip*st.tipMul*(todayEvent.tipMul||1));
    if(o.online)tip=0; var gain=price+tip; st.money+=gain; dayRev+=gain;
    var isSpecial=(o.tea===special.tea&&o.size===special.size&&o.top===special.top);
    if(isSpecial&&!specialDone){ specialDone=true; st.money+=40; dayRev+=40; flash("star"); popTxt("⭐ ĐẶC BIỆT +40k","#c79400"); sPerfect(); setMascot("celebrating",1700); }
    else if(allPerfect){ flash("good"); sPerfect(); popTxt("+"+kstr(gain)+(st.combo>1?" 🔥x"+st.combo:""),"#2e9e4f"); setMascot(st.combo>2?"celebrating":"happy",1300); }
    else { flash("good"); sGood(); popTxt("+"+kstr(gain),"#2e9e4f"); setMascot("happy",1200); }
    daySuccess++; daySales[o.tea]=(daySales[o.tea]||0)+1; dayTip+=tip; discoverCombo(madeTea,madeTop); adjustRep(allPerfect?0.06:0.02); updateTop();
    if(last) finishCustomer(i,o,allPerfect?5:4); else nextCup(o);
  }
  function nextCup(o){ resetSel(); markSel(); renderCup(); updatePour(); renderSlots(); updateChips(); warn("Khách này còn ly nữa — pha tiếp nha!"); }
  function finishCustomer(i,o,stars){ addReview(o,stars); slots[i]=null; afterServe(); }
  function afterServe(){ resetSel(); markSel(); renderCup(); updatePour(); renderSlots(); updateChips(); maybeEnd(); }
  function rejectSlot(i){ if(phase!=="serve")return; var s=slots[i]; if(!s)return;
    st.combo=0; dayServed++; dayReject++; addReview(s.o,2); adjustRep(-0.15); popTxt("Từ chối 🙇","#c07a2c"); slots[i]=null; renderSlots(); updateChips(); maybeEnd(); }
  function slotLeave(i){ var s=slots[i]; if(!s)return; st.combo=0; dayLeft++; dayServed++; addReview(s.o,1); setMascot("sad",1400);
    flash("bad"); beep(300,0.2,"sine",0.07); popTxt("Khách bỏ đi 😤","#e74c3c"); adjustRep(-0.4); slots[i]=null; renderSlots(); updateTop(); updateChips(); maybeEnd(); }
  function staffFailRate(){ return clamp(0.22-(st.staffXp||0)*0.012,0.04,0.22); }
  function staffLevel(){ return 1+Math.floor((st.staffXp||0)/8); }
  function maxStaff(){ return Math.min(MAXSLOTS, 1+Math.floor(tierIdx()/2)); }
  function staffServe(i){ var s=slots[i]; if(!s)return; var o=s.o; if(!haveStockFor(o.size,o.tea,o.top)){ s.staff=0; return; }
    consumeStock(o.size,o.tea,o.top); dayServed++; st.staffXp=(st.staffXp||0)+1;
    var last=(s.served+1>=o.qty); s.served++; var fail=Math.random()<staffFailRate();
    if(fail){ st.combo=0; dayBad++; flash("bad"); beep(200,0.22,"sawtooth",0.08); popTxt("🧑‍🍳 làm hư 💢","#e74c3c"); adjustRep(-0.12); if(last){ addReview(o,2); slots[i]=null; } }
    else { var price=drinkPrice(o); st.money+=price; dayRev+=price; daySuccess++; daySales[o.tea]=(daySales[o.tea]||0)+1; popTxt("🧑‍🍳 +"+kstr(price),"#4e8f44"); adjustRep(0.01); if(last){ addReview(o,4); slots[i]=null; } }
    if(slots[i])slots[i].staff=0; updateTop(); renderSlots(); updateChips(); maybeEnd(); }
  function maybeEnd(){ if(closing && slots.every(function(s){return !s;})) endDay(); else saveGame(); }
  function addReview(o,stars){ st.revCount++; var c=pick(REVIEWS[stars]||REVIEWS[3]);
    st.reviews.unshift({name:o.name,ava:o.ava,fk:o.fk,fb:o.fb,stars:stars,text:c}); if(st.reviews.length>12)st.reviews.pop(); }
  function adjustRep(d){ st.rep=clamp(st.rep+d,0,5); }
  function checkAch(){ if(!st.ach)st.ach={}; var got=[];
    for(var i=0;i<ACHS.length;i++){ var a=ACHS[i]; if(!st.ach[a.k] && a.test()){ st.ach[a.k]=1; st.money+=a.rw; got.push(a.emo+" "+a.n); } }
    if(got.length){ updateTop(); flash("star"); warn("🏅 Mở thành tựu: "+got.join(" · ")); }
    return got.length; }
  function checkTier(){ var ni=tierIdx(); if(ni>(st.tier||0)){ st.tier=ni; var t=TIERS[ni]; flash("star"); popTxt(t.emo+" Lên hạng: "+t.n,"#c79400"); sPerfect(); setMascot("celebrating",1800); } }
  function discoverCombo(teaK,topK){ if(!teaK||!topK||topK==="none")return false; if(!st.col)st.col={};
    for(var i=0;i<COLLECTION.length;i++){ var c=COLLECTION[i]; if(c.tea===teaK&&c.top===topK&&!st.col[c.k]){ st.col[c.k]=1;
      st.money+=25; dayRev+=25; flash("star"); popTxt("🏆 Sưu tập mới +25k","#c79400"); sPerfect();
      if(!st.colDone && Object.keys(st.col).length>=COLLECTION.length){ st.colDone=1; st.money+=200; adjustRep(0.3); setTimeout(function(){ flash("star"); popTxt("🏆 Đủ bộ sưu tập +200k!","#c79400"); },700); }
      return true; } }
    return false; }

  function endDay(){
    phase="summary"; stopSlotLoop(); clearInterval(staffTimer);
    var rent=50, util=20+Object.keys(st.upg).length*5, wage=(st.staffN||0)*STAFF.wage;
    var wasteTea=0, wasteTop=0;
    for(var _ck in st.stock.teas){ var _c=st.stock.teas[_ck]; _c.d=(_c.d||0)-1; if(_c.d<=0){ wasteTea+=_c.q; _c.q=0; _c.d=0; } }
    for(var _tk in st.stock.tops){ var _t=st.stock.tops[_tk]; _t.d=(_t.d||0)-1; if(_t.d<=0){ wasteTop+=_t.q; _t.q=0; _t.d=0; } }
    var waste=Math.round(wasteTea)+wasteTop;
    var gross=dayRev-dayStockCost-rent-util-wage;
    var tax=Math.max(0,Math.round(gross*0.08));
    var loanPay=0, loanBal=0;
    if(st.loan&&st.loan.bal>0){ loanPay=Math.min(st.loan.bal, st.loan.perDay); st.loan.bal=Math.max(0,st.loan.bal-loanPay); loanBal=st.loan.bal; if(st.loan.bal<=0)st.loan=null; }
    st.money-=(rent+util+wage+tax+loanPay);
    var net=gross-tax-loanPay;
    var chalDone=false, chalRw=0;
    if(st.chal && !st.chal.done){ var cd=null; for(var ci=0;ci<CHALS.length;ci++) if(CHALS[ci].k===st.chal.k)cd=CHALS[ci];
      if(cd && cd.ok(st.chal)){ st.chal.done=true; chalDone=true; chalRw=st.chal.rw; st.money+=chalRw; } }
    if(dayRev>(st.best||0)) st.best=dayRev;
    st.totalRev=(st.totalRev||0)+dayRev; st.totalPerfect=(st.totalPerfect||0)+dayPerfect;
    var bestTea=null,bestN=0; for(var tk in daySales){ if(daySales[tk]>bestN){ bestN=daySales[tk]; bestTea=tk; } }
    var rate=(daySuccess+dayBad)>0?Math.round(dayPerfect/(daySuccess+dayBad)*100):0;
    lastRecap={day:st.day,rev:dayRev,stockCost:dayStockCost,rent:rent,util:util,wage:wage,tax:tax,loanPay:loanPay,loanBal:loanBal,waste:waste,net:net,served:dayServed,success:daySuccess,perfect:dayPerfect,bad:dayBad,reject:dayReject,left:dayLeft,tip:dayTip,rate:rate,bestTea:bestTea,bestN:bestN,colN:Object.keys(st.col||{}).length,colTot:COLLECTION.length,chalDone:chalDone,chalRw:chalRw,chalTxt:(st.chal?st.chal.txt:""),best:st.best,rep:st.rep,reviews:st.reviews.slice(0,3)};
    updateChips(); cloudSubScore();
    if(st.money<0){ gameOver("Hết vốn rồi! Quán phải đóng cửa 💸"); return; }
    if(st.rep<2.0){ gameOver("Uy tín quá thấp, khách không tới nữa 😢"); return; }
    st.day++; enterMorning();
  }
  function gameOver(msg){ phase="over"; clearSave(); stopSlotLoop(); clearInterval(staffTimer); $("hubOv").classList.add("hidden");
    $("overCard").innerHTML='<div class="emo">😢</div><h1 class="display" style="font-size:23px">Quán đóng cửa…</h1><p>'+msg+'</p>'
      +'<div class="sumRow"><span>Trụ được</span><span>'+st.day+' ngày</span></div>'
      +'<div class="sumRow" style="border:none"><span>Uy tín cuối</span><span style="color:#e0a53a">'+st.rep.toFixed(1)+' ⭐ · '+st.revCount+' đánh giá</span></div>'
      +'<button class="bigbtn" id="againBtn">🔁 Mở quán lại</button>';
    $("overCard").querySelector("#againBtn").onclick=function(){ $("overOv").classList.add("hidden"); initGame(); };
    $("overOv").classList.remove("hidden");
  }

  function repStars(r){ var full=Math.round(r); return "★★★★★".slice(0,full)+"☆☆☆☆☆".slice(0,5-full); }
  function updateTop(){ $("moneyV").textContent=kstr(st.money);
    $("repStars").textContent=repStars(st.rep); $("repNum").textContent=st.rep.toFixed(1)+" · "+st.revCount+" đánh giá"; }
  function updateTrayBadges(){ var p=$("optTop"); if(!p)return; for(var i=0;i<p.children.length;i++){ var el=p.children[i]; var k=el.getAttribute("data-k"); if(!k||k==="none")continue; el.innerHTML=trayTopSVG(topBy(k),fillLevel(topQ(k)))+'<span class="trayq">'+topQ(k)+'</span>'; } }
  function updateTeaBadges(){ var t=$("optTea"); if(!t)return; for(var i=0;i<t.children.length;i++){ var el=t.children[i]; var k=el.getAttribute("data-k"); var q=el.querySelector(".trayq"); if(q&&k)q.textContent=teaQ(k).toFixed(1)+"L"; } }
  function refreshAvail(){
    var tb=$("optTea"); if(tb){ for(var i=0;i<tb.children.length;i++){ var e0=tb.children[i]; var tk0=e0.getAttribute("data-k"); e0.classList.toggle("soldout", st.stock.cup<1 || teaQ(tk0)<teaUse("M")-1e-9); } }
    var sb=$("optSize"); if(sb){ for(var j=0;j<sb.children.length;j++){ var el=sb.children[j]; var k=el.getAttribute("data-k"); el.classList.toggle("soldout", st.stock.cup<1 || (k==="L" ? !anyTea("L") : !anyTea("M"))); } }
    var pb=$("optTop"); if(pb){ for(var m=0;m<pb.children.length;m++){ var e2=pb.children[m]; var tk=e2.getAttribute("data-k"); e2.classList.toggle("soldout", !!(tk&&tk!=="none"&&topQ(tk)<1)); } }
  }
  function updateChips(){ $("nCup").textContent=st.stock.cup; $("nTea").textContent=teaTotal().toFixed(1)+"L"; $("nTop").textContent=totalTops(); updateTrayBadges(); updateTeaBadges(); refreshAvail();
    $("chipCup").classList.toggle("low",st.stock.cup<=1); $("chipTea").classList.toggle("low",teaTotal()<0.6); $("chipTop").classList.toggle("low",totalTops()<=1);
    $("chipStaff").style.display=(st.staffN||0)>0?"inline-flex":"none"; $("chipStaff").innerHTML='🧑‍🍳'+((st.staffN||0)>1?' <b>×'+st.staffN+'</b>':'');
    $("queueLeft").textContent = phase==="serve" ? (closing?"🧹 Đang dọn quán":((todayEvent&&todayEvent.name?todayEvent.name+" · ":"")+"🕐 "+fmtClock(CLOSE))) : ""; }
  var _mascotT=null;
  function setMascot(name,hold){ var m=$("mascot"); if(!m)return; m.src="assets/pobo_"+name+".png"; m.style.transform="scale(1.07)"; setTimeout(function(){ var mm=$("mascot"); if(mm)mm.style.transform=""; },160); clearTimeout(_mascotT); if(hold){ _mascotT=setTimeout(function(){ var mm=$("mascot"); if(mm)mm.src="assets/pobo_idle.png"; },hold); } }
  function flash(k){ var f=$("flash"); f.className=""; void f.offsetWidth; f.className=k; }
  function popTxt(t,c){ var el=document.createElement("div"); el.className="pop"; el.textContent=t; el.style.color=c; el.style.left="50%"; el.style.top="40%"; el.style.transform="translate(-50%,0)"; document.body.appendChild(el); setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1100); }
  var warnT=null;
  function warn(t){ var w=$("warnbar"); w.textContent="⚠️ "+t; w.style.display="block"; clearTimeout(warnT); warnT=setTimeout(function(){w.style.display="none";},1600); }

  function initGame(){
    st={ shop:st.shop, day:1, money:400, rep:5.0, revCount:0, combo:0, teaUn:{milk:1,matcha:1}, topUn:{none:1,black:1,white:1}, upg:{}, staffN:0,
      extraCust:0, patBonus:0, pourTol:0, tipMul:1.0, stock:freshStock(), reviews:[], col:{}, colDone:0, loan:null, ach:{}, tier:0, best:0, everLoan:0, promoOn:false, chal:null, totalRev:0, totalPerfect:0, lastBuy:null, staffXp:0 };
    lastRecap=null; clearSave(); $("shopName").textContent=st.shop;
    buildServeUI(); resetSel(); markSel(); renderCup(); updatePour(); updateTop(); updateChips(); enterMorning();
    if(CLOUD && !st.code) cloudNew(function(c){ if(c){ renderHubHead(); warn("🔑 Mã quán của bạn: "+c+" — ghi lại để đổi máy nhé!"); } });
  }
  var _saved=loadSave();
  function resumeSaved(){ applySave(_saved); $("shopName").textContent=st.shop; buildServeUI(); resetSel(); markSel(); renderCup(); updatePour(); updateTop(); updateChips(); lastRecap=null; $("startOv").classList.add("hidden"); enterMorning(); }
  function newGameInput(){ var v=($("shopInput").value||"").trim(); if(v)st.shop=v.slice(0,16); $("startOv").classList.add("hidden"); initGame(); }
  $("openBtn").onclick=function(){ au(); if(AC&&AC.state==="suspended")AC.resume(); if(_saved && $("openBtn").getAttribute("data-resume")==="1") resumeSaved(); else newGameInput(); };
  $("shopInput").addEventListener("keydown",function(e){ if(e.key==="Enter")$("openBtn").click(); });
  $("newGameBtn").onclick=function(){ _saved=null; clearSave(); setupStart(); };
  $("codeBtn").onclick=function(){ au(); if(!CLOUD){ alert("Lưu online đang bật sau, tạm thời chơi local nhé."); return; }
    var c=(window.prompt("Nhập mã quán (vd AB12345):")||"").trim().toUpperCase(); if(!c)return;
    cloudLoad(c).then(function(d){ if(d&&d.ok&&d.data){ var sv=null; try{sv=JSON.parse(d.data);}catch(e){}
      if(sv){ applySave(sv); st.code=c; saveGame(); _saved=null; $("shopName").textContent=st.shop; buildServeUI(); resetSel(); markSel(); renderCup(); updatePour(); updateTop(); updateChips(); lastRecap=null; $("startOv").classList.add("hidden"); enterMorning(); return; } }
      alert("Không tìm thấy mã này."); }).catch(function(){ alert("Lỗi mạng, thử lại sau."); });
  };
  function setupStart(){ if(_saved){ $("openBtn").textContent="▶ Chơi tiếp — Ngày "+_saved.day; $("openBtn").setAttribute("data-resume","1"); $("shopInput").style.display="none"; $("startSub").textContent="Chào mừng trở lại! "+(_saved.shop||"Quán")+" · Ngày "+_saved.day+" · Vốn "+kstr(_saved.money)+"."; $("newGameBtn").style.display="inline-block"; } else { $("openBtn").textContent="Bắt đầu"; $("openBtn").removeAttribute("data-resume"); $("shopInput").style.display=""; $("newGameBtn").style.display="none"; } }
  setupStart();
  buildServeUI(); resetSel(); markSel(); renderCup(); updatePour();
  function renderSettings(){
    var h='';
    h+='<div class="buyRow"><div class="bi">'+(muted?'🔇':'🔊')+'</div><div class="bt"><div class="n">Âm thanh</div><div class="d">Tiếng tách, chuông khi phục vụ</div></div><button class="buyBtn'+(muted?'':' own')+'" id="setSound">'+(muted?'Bật lại':'Đang bật')+'</button></div>';
    if(st.code) h+='<div class="buyRow"><div class="bi">🔑</div><div class="bt"><div class="n">Mã quán</div><div class="d">'+st.code+' · đổi máy nhập mã này để lấy lại data</div></div><button class="buyBtn" id="setCopy">Chép</button></div>';
    h+='<div class="buyRow"><div class="bi">▶️</div><div class="bt"><div class="n">Cách chơi</div><div class="d">Chọn ly → GIỮ bình trà rót tới vạch → thêm topping/đường/đá → Giao ly đúng đơn khách.</div></div></div>';
    h+='<div class="buyRow" style="border:none"><div class="bi">🔄</div><div class="bt"><div class="n">Chơi mới từ đầu</div><div class="d">Làm lại từ ngày 1 (tạo quán mới).</div></div><button class="buyBtn" id="setReset">Chơi mới</button></div>';
    $("setBody").innerHTML=h;
    $("setSound").onclick=function(){ muted=!muted; $("mute").textContent=muted?"🔇":"🔊"; sTap(); renderSettings(); };
    if($("setCopy"))$("setCopy").onclick=function(){ try{ navigator.clipboard.writeText(st.code); }catch(e){} warn("Đã chép mã quán "+st.code); };
    $("setReset").onclick=function(){ if(!window.confirm("Chơi mới từ đầu? Quán hiện tại sẽ được làm mới."))return;
      $("setOv").classList.add("hidden"); $("hubOv").classList.add("hidden"); $("overOv").classList.add("hidden");
      stopSlotLoop(); clearInterval(staffTimer); phase="start"; _saved=null; clearSave(); setupStart(); $("startOv").classList.remove("hidden"); };
  }
  function openSettings(){ au(); if(phase==="serve"){ stopSlotLoop(); clearInterval(staffTimer); } renderSettings(); $("setOv").classList.remove("hidden"); }
  function closeSettings(){ $("setOv").classList.add("hidden"); if(phase==="serve"){ staffSlot=-1; startDayLoop(); } }
  $("gearBtn").onclick=openSettings;
  $("setClose").onclick=closeSettings;
  document.addEventListener("visibilitychange",function(){ if(document.hidden && (phase==="serve"||phase==="hub")) saveGame(); });
  window.addEventListener("beforeunload",function(){ if(phase==="serve"||phase==="hub") saveGame(); });
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
